name: 构建书途APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: 解压工程
        run: |
          if [ -f app-src.zip ]; then
            unzip -q app-src.zip -d project
          else
            mkdir -p outer
            for z in $(find . -maxdepth 1 -name '*.zip'); do
              unzip -o -q "$z" -d outer 2>/dev/null || true
            done
            SRC=$(find outer -name app-src.zip | head -1)
            if [ -z "$SRC" ]; then
              echo "没找到 app-src.zip，请把工程包放进仓库根目录"
              exit 1
            fi
            unzip -q "$SRC" -d project
          fi
          test -f project/www/index.html || (echo "网页入口缺失"; exit 1)
      - name: 安装依赖
        working-directory: project
        run: npm install --no-audit --no-fund
      - name: 打包锁屏提醒脚本
        working-directory: project
        run: npx esbuild native-alarm.js --bundle --format=iife --outfile=www/native-alarm.js
      - name: 生成 Android 工程
        working-directory: project
        env:
          CI: 'true'
        run: |
          npx cap add android
          npx cap sync android
      - name: 补齐系统权限
        working-directory: project
        run: python3 patch-android.py
      - name: 编译 APK
        working-directory: project/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 取出 APK
        run: cp project/android/app/build/outputs/apk/debug/app-debug.apk 书途.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 书途APK
          path: 书途.apk
      - name: 放回仓库方便手机直接下载
        run: |
          git config user.name "shutu-bot"
          git config user.email "shutu-bot@users.noreply.github.com"
          git add -f 书途.apk
          git commit -m "自动生成书途 APK" || echo "没有变化"
          git push || echo "push 没成功也没关系，去下面的 Artifacts 下载一样能装"

